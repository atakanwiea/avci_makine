<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı - AVCI MAKİNE İNŞAAT</title>
    <meta name="description" content="Avcı Makine İnşaat ürün detayı.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- BREADCRUMB -->
    <div class="breadcrumb-section">
        <div class="container">
            <nav class="breadcrumb">
                <a href="index.html"><i class="fas fa-home"></i> Ana Sayfa</a>
                <i class="fas fa-chevron-right"></i>
                <a href="urunler.html" id="bc-category-link">Ürünler</a>
                <i class="fas fa-chevron-right"></i>
                <span id="bc-product-name">Ürün Yükleniyor...</span>
            </nav>
        </div>
    </div>

    <!-- ÜRÜN DETAY SECTION -->
    <section class="product-detail">
        <div class="container" id="product-detail-container">
            <!-- JavaScript ile doldurulacak -->
            <div style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p>Ürün bilgileri yükleniyor...</p>
            </div>
        </div>
    </section>

    <script src="components.js"></script>
    <script src="script.js"></script>
    <script>
        // Tab fonksiyonları
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
